<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanzones AutoPay Checkout</title>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #030303;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background-color: #0d0d0f;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255,0,127,0.4);
            box-shadow: 0px 10px 30px rgba(255,0,127,0.2);
            text-align: center;
            width: 320px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
            text-align: left;
        }
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            border: 1px solid #333;
            background: #000;
            color: #ff007f;
            border-radius: 8px;
        }
        button {
            background: linear-gradient(135deg, #ff007f, #e11d48, #ff5e00);
            color: white;
            padding: 14px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="color: #ff007f; margin-top:0;">AutoPay Subscription</h2>
        <p style="color: #bbb; font-size:13px; margin-bottom:20px;">अपना मासिक प्लान चुनें। सेटअप पूरा होने के बाद अगले दिन से ऑटोमैटिक सब्सक्रिप्शन कटेगा।</p>
        
        <label>प्लान चुनें:</label>
        <select id="subAmount">
            <option value="500">₹500 / महीना</option>
            <option value="1000">₹1000 / महीना</option>
            <option value="3000">₹3000 / महीना</option>
        </select>
        
        <button onclick="startAutopay()">Setup UPI AutoPay</button>
    </div>

    <script>
        async function startAutopay() {
            const selectedAmount = document.getElementById('subAmount').value;

            try {
                // 1. Backend को रिक्वेस्ट भेजना ताकि Subscription / Autopay आर्डर बन सके
                const response = await fetch('/create-subscription', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subscriptionAmount: selectedAmount }) 
                });

                if (!response.ok) {
                    alert("Backend Error! सर्वर से कनेक्ट नहीं हो पा रहा है।");
                    return;
                }

                const subscription = await response.json();

                // 2. Razorpay Autopay Checkout खोलना
                var options = {
                    "key": "rzp_live_Tt1BBebmFbTNfO", // आपकी Live Key
                    "subscription_id": subscription.id, // बेहद जरूरी: यहाँ order_id की जगह subscription_id रहेगा
                    "name": "Fanzones Premium",
                    "description": "Monthly AutoPay Mandate",
                    "image": "https://i.imgur.com/3g7nmJC.png",
                    "handler": function (response){
                        alert("✅ AutoPay Setup Successful! सब्सक्रिप्शन एक्टिव हो गया है।");
                        
                        // पेमेंट/मैंडेट अप्रूव होने के बाद यूजर को आपकी मेन वेबसाइट पर रीडायरेक्ट कर देगा
                        window.location.href = "https://buildolive4-star.github.io/Fanzone/index.html?payment=success&sub_id=" + response.razorpay_subscription_id;
                    },
                    "theme": {
                        "color": "#ff007f"
                    }
                };
                
                var rzp1 = new Razorpay(options);
                rzp1.open();
                
            } catch (error) {
                alert("कनेक्शन एरर! कृपया दोबारा कोशिश करें।");
                console.error(error);
            }
        }
    </script>
</body>
</html>
