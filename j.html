<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanzones AutoPay Setup</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #030303;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background-color: #0d0d0f;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255,0,127,0.4);
            box-shadow: 0px 10px 30px rgba(255,0,127,0.2);
            text-align: center;
            width: 320px;
        }
        button {
            background: linear-gradient(135deg, #ff007f, #e11d48, #ff5e00);
            color: white;
            padding: 14px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 15px;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="color: #ff007f; margin-top:0;">VIP Membership</h2>
        <p style="color: #ccc; font-size:14px; line-height: 1.5;">
            आज सिर्फ <b style="color:#ff007f;">₹5</b> देकर UPI AutoPay सेटअप करें। <br><br>
            उसके बाद अगले महीने से आपके अकाउंट से <b style="color:#ff007f;">₹3000 प्रति माह</b> ऑटोमैटिक कटेंगे।
        </p>
        
        <button onclick="startAutopay()">Pay ₹5 & Setup AutoPay</button>
    </div>

    <script>
        async function startAutopay() {
            try {
                // Backend से Subscription मँगवाना जिसमें ₹5 का सेटअप और ₹3000 का प्लान है
                const response = await fetch('/create-subscription', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    alert("Backend Error! सर्वर चेक करें।");
                    return;
                }

                const subscription = await response.json();

                // Razorpay Checkout खोलना
                var options = {
                    "key": "rzp_live_Tt1BBebmFbTNfO", // आपकी Live Key
                    "subscription_id": subscription.id, 
                    "name": "Fanzones Premium",
                    "description": "Setup ₹5 Autopay for ₹3000/mo Plan",
                    "image": "https://i.imgur.com/3g7nmJC.png",
                    "handler": function (response){
                        alert("✅ AutoPay Setup Successful! सब्सक्रिप्शन एक्टिव हो गया है।");
                        
                        // सफलता के बाद यूजर को मेन साइट पर भेजना
                        window.location.href = "https://buildolive4-star.github.io/Fanzone/index.html?payment=success&sub_id=" + response.razorpay_subscription_id;
                    },
                    "theme": {
                        "color": "#ff007f"
                    }
                };
                
                var rzp1 = new Razorpay(options);
                rzp1.open();
                
            } catch (error) {
                alert("कनेक्शन एरर! कृपया दोबारा कोशिश करें।");
                console.error(error);
            }
        }
    </script>
</body>
</html>
