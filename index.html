<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Test Page</title>
    <!-- Razorpay SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #16a34a;
            color: white;
            padding: 12px 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #15803d;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>पेमेंट टेस्ट करें</h2>
        <p>चेक करने के लिए 1 रुपया डालें:</p>
        
        <!-- रकम डालने का बॉक्स -->
        <input type="number" id="payAmount" value="1" placeholder="Amount (₹)">
        
        <!-- पेमेंट बटन -->
        <button onclick="testPayment()">Pay Now</button>
    </div>

    <script>
        async function testPayment() {
            const amt = document.getElementById('payAmount').value;

            if (!amt || amt <= 0) {
                alert("कृपया सही रकम डालें!");
                return;
            }

            try {
                // 1. Backend से आर्डर बनाना
                const response = await fetch('/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: amt }) 
                });

                if (!response.ok) {
                    alert("Backend Error! क्या Render पर सर्वर चालू है?");
                    return;
                }

                const order = await response.json();

                // 2. Razorpay चालू करना
                var options = {
                    "key": "rzp_live_Tt1BBebmFbTNfO", // आपकी Live Key
                    "amount": order.amount,
                    "currency": "INR",
                    "name": "Test Payment",
                    "description": "Checking Razorpay",
                    "order_id": order.id, 
                    "handler": function (response){
                        alert("✅ Payment Successful!\nPayment ID: " + response.razorpay_payment_id);
                    },
                    "theme": {
                        "color": "#16a34a"
                    }
                };
                
                var rzp1 = new Razorpay(options);
                rzp1.open();
                
            } catch (error) {
                alert("सर्वर कनेक्ट नहीं हो रहा है! Render चेक करें।");
                console.error(error);
            }
        }
    </script>
</body>
</html>
