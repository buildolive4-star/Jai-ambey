<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Visibility Control Panel</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==================== CSS STYLES ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #eef2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 500px) {
            .app-container {
                min-height: 90vh;
                border-radius: 20px;
            }
        }

        /* Screens */
        .screen {
            display: none;
            padding: 30px 20px;
            animation: fadeIn 0.4s ease;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 25px;
            text-align: center;
        }
        .header-title i {
            color: #b91338;
        }

        /* Login Screen */
        .login-box {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .form-control {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .form-control:focus {
            border-color: #b91338;
        }
        .btn-submit {
            width: 100%;
            background: #b91338;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:active { transform: scale(0.95); }

        /* Dashboard Screen */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        .btn-logout {
            background: #eee;
            color: #333;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .profile-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .control-info h3 {
            font-size: 1.2rem;
            color: #1a1a1a;
            margin-bottom: 5px;
        }
        .control-info p {
            font-size: 0.85rem;
            color: #888;
        }

        /* Toggle Switch CSS */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #25d366; /* Green for ON */
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Loader Overlay */
        #loaderOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #333;
            z-index: 9999;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #b91338;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ==================== SCREEN 1: LOGIN ==================== -->
        <div id="screen-login" class="screen active">
            <h1 class="header-title"><i class="fa-solid fa-lock"></i> Security Panel</h1>
            <div class="login-box">
                <p style="text-align:center; color:#666; margin-bottom: 20px; font-size:0.9rem;">
                    Enter the secret password to manage visibility of your profile.
                </p>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Secret Password</label>
                        <input type="text" id="secretPassword" class="form-control" placeholder="Enter password..." required>
                    </div>
                    <button type="submit" class="btn-submit">Access Profile</button>
                </form>
            </div>
        </div>

        <!-- ==================== SCREEN 2: DASHBOARD ==================== -->
        <div id="screen-dashboard" class="screen">
            <div class="dashboard-header">
                <h2 style="font-size: 1.3rem;"><i class="fa-solid fa-sliders" style="color:#b91338;"></i> Control</h2>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
            
            <p style="color:#666; margin-bottom: 15px; font-size: 0.9rem;">
                Toggle the switch to show (ON) or hide (OFF) the profile on the main gallery.
            </p>

            <div class="profile-list" id="profileListContainer">
                <!-- Matched profiles will load here dynamically -->
            </div>
        </div>

        <!-- ==================== LOADER ==================== -->
        <div id="loaderOverlay">
            <div class="spinner"></div>
            <h4 id="loaderText">Processing...</h4>
        </div>

    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration (Same as the main app)
        const firebaseConfig = {
            apiKey: "AIzaSyB0asuJKj9wyoInuS6_mhLdWDo4OkAM_k4",
            authDomain: "oooo-67c5c.firebaseapp.com",
            databaseURL: "https://oooo-67c5c-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "oooo-67c5c",
            storageBucket: "oooo-67c5c.firebasestorage.app",
            messagingSenderId: "605074662310",
            appId: "1:605074662310:web:aeb1610acf19a39413e567",
            measurementId: "G-N7SZ6YW3L5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global States
        let allProfiles = [];
        let currentActivePassword = null;

        // Fetch All Profiles Realtime
        onValue(ref(db, 'user_galleries'), (snapshot) => {
            const data = snapshot.val();
            allProfiles = [];
            if (data) {
                Object.entries(data).forEach(([id, val]) => {
                    allProfiles.push({ id, ...val });
                });
            }
            
            // If already logged in, refresh the dashboard so toggle switches reflect real-time changes
            if(currentActivePassword) {
                renderDashboard();
            }
        });

        // UI Helpers
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(scr => scr.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showLoader(text = "Processing...") {
            document.getElementById('loaderText').innerText = text;
            document.getElementById('loaderOverlay').style.display = 'flex';
        }

        function hideLoader() {
            document.getElementById('loaderOverlay').style.display = 'none';
        }

        // Login Form Submit
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputPass = document.getElementById('secretPassword').value.trim();
            
            if(!inputPass) return;

            showLoader("Verifying...");
            
            setTimeout(() => {
                // Check if any profile has this password
                const matchedProfiles = allProfiles.filter(p => p.password === inputPass);
                
                hideLoader();

                if(matchedProfiles.length > 0) {
                    currentActivePassword = inputPass;
                    switchScreen('screen-dashboard');
                    renderDashboard();
                } else {
                    alert("Incorrect Password! No profiles found with this secret code.");
                }
            }, 800); // Artificial small delay for UX
        });

        // Render Dashboard with Matched Profiles
        function renderDashboard() {
            const container = document.getElementById('profileListContainer');
            container.innerHTML = '';

            const matchedProfiles = allProfiles.filter(p => p.password === currentActivePassword);

            if(matchedProfiles.length === 0) {
                container.innerHTML = '<p style="color:red;">No profiles found anymore.</p>';
                return;
            }

            matchedProfiles.forEach(profile => {
                // Default is true if isVisible is undefined
                const isProfileOn = profile.isVisible !== false; 

                const card = document.createElement('div');
                card.className = 'control-card';
                
                card.innerHTML = `
                    <div class="control-info">
                        <h3>${profile.name}</h3>
                        <p>Status: <strong style="color:${isProfileOn ? '#25d366' : '#e74c3c'}">${isProfileOn ? 'VISIBLE (ON)' : 'HIDDEN (OFF)'}</strong></p>
                    </div>
                    <div>
                        <label class="switch">
                            <input type="checkbox" ${isProfileOn ? 'checked' : ''} onchange="toggleVisibility('${profile.id}', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Toggle Visibility Logic (Updates Firebase instantly)
        window.toggleVisibility = function(profileId, newStatus) {
            showLoader("Updating Database...");
            
            const updates = {};
            updates['/user_galleries/' + profileId + '/isVisible'] = newStatus;

            update(ref(db), updates).then(() => {
                hideLoader();
                // We don't need to manually re-render, onValue will trigger and refresh the UI automatically
            }).catch(err => {
                hideLoader();
                alert("Failed to update status: " + err.message);
                // Re-render to revert the toggle switch visually if it failed
                renderDashboard(); 
            });
        };

        // Logout
        window.logout = function() {
            currentActivePassword = null;
            document.getElementById('secretPassword').value = '';
            switchScreen('screen-login');
        };

    </script>
</body>
</html>
